# Experiment C: all training choices are PROJECT_ADAPTATION.
experiment_name: full_video_c3d_style_continuous_v1
run_dir: runs/full_video_c3d_style_continuous_v1
seed: 20260930
dataset_path: archive/Basketball_51 dataset
manifest_path: data/processed/dataset_manifest.csv
